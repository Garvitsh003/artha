services:
  artha:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN in .env}
      COOKIE_SECURE: "1"
      DATA_DIR: /data
      TRUSTED_HOSTS: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - artha_data:/data
    expose:
      - "5000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - artha
volumes:
  artha_data:
  caddy_data:
  caddy_config:
